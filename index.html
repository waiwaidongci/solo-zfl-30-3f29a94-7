<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜水记录</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 14px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 24px; }
    h2 { font-size: 17px; margin: 14px 0 8px; }
    h3 { font-size: 14px; margin: 12px 0 4px; color: #1d6c78; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; min-height: 40px; }
    button.secondary { background: #64777b; }
    button.warn { background: #b03a2e; }
    button.ok { background: #2e7d32; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { min-height: 56px; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    .head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .head-actions input { width: 150px; }
    .app { display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 16px; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .map { position: relative; height: calc(100vh - 170px); min-height: 480px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; padding: 0; min-height: 0; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .marker.st-review { border-color: #f0b45a; } .marker.st-returned { border-color: #ff8a7a; border-style: dashed; } .marker.st-archived { border-color: #7fd08a; }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: #5c7378; }
    .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .batchbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px; background: #f2f8f9; border: 1px solid #d7e4e5; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
    .batchbar button { padding: 7px 10px; min-height: 34px; font-size: 13px; }
    .batchbar label { margin: 0; display: flex; gap: 4px; align-items: center; }
    .batchbar input[type=checkbox] { width: auto; }
    .msg { border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
    .msg.error { background: #fdecea; border: 1px solid #f2b8b0; color: #8c2f24; }
    .msg.ok { background: #e8f5e9; border: 1px solid #a9d8b0; color: #1f5c28; }
    .msg ul { margin: 6px 0 0; padding-left: 18px; }
    .list { display: grid; gap: 8px; max-height: 320px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .item .row { display: flex; gap: 8px; align-items: center; }
    .item input[type=checkbox] { width: auto; flex: none; }
    .timeline { display: grid; gap: 8px; max-height: 320px; overflow: auto; }
    .audit { display: grid; gap: 8px; max-height: 320px; overflow: auto; font-size: 13px; }
    .audit .entry { border: 1px solid #d7e4e5; border-radius: 8px; padding: 8px 10px; }
    .audit .diff { color: #5c7378; font-size: 12px; margin-top: 4px; }
    .pill { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 12px; color: #fff; }
    .pill.collected { background: #1d6c78; } .pill.review { background: #b97a1a; } .pill.returned { background: #b03a2e; } .pill.archived { background: #2e7d32; }
    .pill.type { background: #fff; color: #183035; border: 1px solid #c9dadc; }
    .muted { color: #5c7378; font-size: 13px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
    .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .btnrow button { flex: 1 1 auto; }
    .statusline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
    .returnnote { background: #fdecea; border: 1px solid #f2b8b0; border-radius: 6px; padding: 8px 10px; font-size: 13px; color: #8c2f24; margin-top: 6px; }
    fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    fieldset:disabled input, fieldset:disabled select, fieldset:disabled textarea { background: #f0f4f5; color: #7a8b8f; }
    @media (max-width: 980px) {
      header { padding: 12px; }
      h1 { font-size: 20px; }
      .head-actions { width: 100%; }
      .head-actions input { flex: 1 1 120px; }
      .head-actions button { flex: 1 1 auto; }
      .app { grid-template-columns: 1fr; padding: 10px; }
      .map { height: 52vh; min-height: 320px; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .list, .timeline, .audit { max-height: none; }
      button { min-height: 44px; }
    }
  </style>
</head>
<body>
  <header>
    <div><h1>水下考古潜水记录</h1><div class="muted">采集 → 复核 → 退回补证 → 入库，全程留痕，可撤销重做。</div></div>
    <div class="head-actions">
      <input id="operator" placeholder="操作人（必填）" autocomplete="off">
      <button id="undoBtn" class="secondary" type="button">↶ 撤销</button>
      <button id="redoBtn" class="secondary" type="button">↷ 重做</button>
      <button id="exportBtn" type="button">导出JSON</button>
    </div>
  </header>
  <main class="app">
    <section class="panel">
      <div class="map" id="map"><div class="wreck"></div></div>
      <div class="legend">
        <span><i style="background:#1d6c78"></i>采集</span>
        <span><i style="background:#b97a1a"></i>复核</span>
        <span><i style="background:#b03a2e"></i>退回补证</span>
        <span><i style="background:#2e7d32"></i>入库</span>
        <span class="muted">标记底色为文物类型，描边为流转状态；点击空白处新增标记。</span>
      </div>
    </section>
    <aside class="panel">
      <div class="toolbar">
        <select id="filterType"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
        <select id="filterStatus"><option value="">全部状态</option><option value="collected">采集</option><option value="review">复核</option><option value="returned">退回补证</option><option value="archived">入库</option></select>
        <select id="view"><option value="list">标记列表</option><option value="timeline">潜次时间线</option><option value="audit">变更记录</option></select>
      </div>
      <div class="batchbar" id="batchBar">
        <label><input type="checkbox" id="checkAll"> 全选</label>
        <button id="batchReviewBtn" type="button">批量提交复核</button>
        <button id="batchApproveBtn" type="button" class="ok">批量通过入库</button>
        <span class="muted" id="batchHint"></span>
      </div>
      <div id="msg" class="msg" hidden></div>
      <form id="form" novalidate>
        <h2>标记信息</h2>
        <div class="statusline" id="statusLine" hidden>
          <span class="pill" id="statusPill"></span>
          <span class="muted" id="statusHint"></span>
        </div>
        <div class="returnnote" id="returnNote" hidden></div>
        <fieldset id="fields">
          <div class="grid2">
            <div><label>编号</label><input name="code" required></div>
            <div><label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select></div>
          </div>
          <div class="grid2">
            <div><label>潜次</label><input name="dive" placeholder="例如DIVE-04" required></div>
            <div><label>深度（米，≤<span id="maxDepthLabel">40</span>）</label><input name="depth" type="number" step="0.1" min="0" placeholder="例如18.4" required></div>
          </div>
          <div class="grid2">
            <div><label>坐标X（0~100）</label><input name="x" type="number" step="0.01" min="0" max="100" required></div>
            <div><label>坐标Y（0~100）</label><input name="y" type="number" step="0.01" min="0" max="100" required></div>
          </div>
          <div class="grid2">
            <div><label>朝向</label><input name="orientation" placeholder="例如东北偏北"></div>
            <div><label>保存状态</label><input name="condition" placeholder="例如表面附着贝类"></div>
          </div>
          <label>备注</label><textarea name="note"></textarea>
          <h3>证据链（提交复核前补齐）</h3>
          <div class="grid2">
            <div><label>采样袋号</label><input name="bagNo" placeholder="例如BAG-12"></div>
            <div><label>处理人</label><input name="handler" placeholder="例如李四"></div>
          </div>
          <label>照片说明</label><input name="photoDesc" placeholder="例如全景1张+特写2张，相机C2">
          <label>保管位置</label><input name="storage" placeholder="例如冷藏柜A-01-03">
        </fieldset>
        <label>操作原因（退回/删除必填，其余变更亦会留痕）</label><input name="reason" id="reasonInput" placeholder="例如照片模糊，需补拍">
        <div class="btnrow" id="transitionBar"></div>
        <div class="btnrow">
          <button type="submit" id="saveBtn">保存标记</button>
          <button type="button" id="deleteBtn" class="warn">删除</button>
          <button type="button" id="resetBtn" class="secondary">清空</button>
        </div>
      </form>
      <h2 id="listTitle">标记列表</h2>
      <div id="list" class="list"></div>
    </aside>
  </main>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
